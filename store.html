<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>Tienda - GW Lavado Ecologico</title>
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
  <link href="css/styles.css" rel="stylesheet"/>
  <link href="css/responsive.css" rel="stylesheet"/>
  <link rel="icon" type="image/x-icon" href="/images/logogwlavadoeco.png">
</head>
<body><header class="navbar-container">
  <nav class="navbar">
    <!-- 1. Logo / Marca -->
    <a href="index.html" class="brand-logo">
      <img src="./images/logogwlavadoeco.png" alt="GW Lavado Ecologico Logo" class="logo-image">
    </a>

    <!-- 2. Barra de Búsqueda -->
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos, marcas y más..." aria-label="Buscar productos">
      <button type="submit" class="search-btn" aria-label="Buscar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <!-- 3. Menú de Navegación Principal -->
    <ul class="nav-links">
      <li><a href="index.html" class="active">INICIO</a></li>
      <li><a href="store.html">TIENDA VIRTUAL</a></li>
      <li><a href="cursos.html">CURSOS</a></li>
      <li><a href="#">NOSOTROS</a></li>
      <li><a href="contact.html">CONTACTO</a></li>
    </ul>

    <!-- 4. Acciones del Usuario (Cuenta y Carrito) -->
    <div class="user-actions">
      <!-- Mi Cuenta / Login -->
      <a href="#" class="action-btn account-btn" title="Mi Cuenta" data-toggle="modal" data-target="#loginModal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="btn-text">Ingresar</span>
      </a>

      <!-- Carrito de Compras -->
      <a href="#" class="action-btn cart-btn" title="Carrito de Compras">
        <div class="cart-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">3</span>
        </div>
      </a>
    </div>

    <!-- 5. Botón Hamburguesa para Mobile -->
    <button class="mobile-menu-btn" aria-label="Abrir menú">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </nav>
</header>

    <!-- end header section -->
  <div class="banner-curso">
    <!-- end slider section -->
  </div>

  <section class="store_section layout_padding">
    <div class="container">
      <div class="custom_heading-container">
        <h2> Nuestra Tienda </h2>
      </div>
      <p class="text-center">Productos ecológicos y servicios adicionales. Añade al carrito para comprar.</p>

      <div class="row products-grid">
        <!-- Productos se cargan dinámicamente desde /api/products -->
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px" id="store-controls"></div>

      <div class="text-center mt-4">
        <a href="cart.html" id="store-view-cart" class="btn btn-primary">Ver carrito</a>
      </div>

    </div>
  </section>
  
  <!-- Course info modal -->
  <div class="modal fade" id="courseModal" tabindex="-1" role="dialog" aria-labelledby="courseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="courseModalLabel"></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-5">
              <img src="" alt="" class="img-fluid modal-image" onerror="this.src='images/slider-img.png'">
            </div>
            <div class="col-md-7">
              <p class="modal-desc"></p>
              <p class="modal-stock" style="font-weight:600;margin-top:8px"></p>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
          <a href="cart.html" class="btn btn-primary">Comprar</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/store.js"></script>
  <script>
  (function($){
    $(document).on('click', '.boton-info', function(e){
      var $btn = $(this);
      var img = $btn.data('image') || '';
      var title = $btn.data('title') || '';
      var desc = $btn.data('description') || '';
      var stock = typeof $btn.data('stock') !== 'undefined' ? Number($btn.data('stock')) : null;
      $('#courseModalLabel').text(title);
      $('#courseModal .modal-image').attr('src', img);
      $('#courseModal .modal-desc').text(desc);
      if(stock === null) $('#courseModal .modal-stock').text('');
      else if(stock > 0) { $('#courseModal .modal-stock').text('En stock: ' + stock).css('color',''); }
      else { $('#courseModal .modal-stock').text('Agotado Temporalmente').css('color','red'); }
      $('#courseModal').modal('show');
    });
  })(jQuery);
  // Intercept the store "Ver carrito" button to require authentication
  (function(){
    const btn = document.getElementById('store-view-cart');
    if(!btn) return;
    async function isAuthenticated(){
      try{ if(document.getElementById('account-nav-link')) return true; }catch(e){}
      try{
        const API_BASE = (window.API_BASE || window.location.origin).replace(/\/$/, '');
        const res = await fetch(API_BASE + '/api/me', { credentials: 'include', cache: 'no-store' });
        if(res.status === 401) return false;
        const ct = res.headers.get('content-type') || '';
        if(ct.includes('application/json')){
          const data = await res.json();
          return !!(data && data.ok && data.user);
        }
        return false;
      }catch(err){ return false; }
    }
    btn.addEventListener('click', async function(e){
      const ok = await isAuthenticated();
      if(!ok){ e.preventDefault(); alert('Debes iniciar sesión para ver el carrito'); window.location.href = 'login.html'; }
    });
  })();
  </script>
</body>
</html>
