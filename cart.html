<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>Carrito - GW Lavado Ecologico</title>
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
  <link href="css/styles.css" rel="stylesheet"/>
</head>
<body>
  <header class="navbar-container">
    <nav class="navbar">
      <a href="index.html" class="brand-logo">
        <img src="./images/logogwlavadoeco.png" alt="GW Lavado Ecologico Logo" class="logo-image">
      </a>

      <div class="search-bar">
        <input type="text" placeholder="Buscar productos, marcas y más..." aria-label="Buscar productos">
        <button type="submit" class="search-btn" aria-label="Buscar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <ul class="nav-links">
        <li><a href="index.html">INICIO</a></li>
        <li><a href="tienda-virtual.html">TIENDA VIRTUAL</a></li>
        <li><a href="cursos.html">CURSOS</a></li>
        <li><a href="#">NOSOTROS</a></li>
        <li><a href="contact.html" class="active">CONTACTO</a></li>
      </ul>

      <div class="user-actions">
        <a href="#" class="action-btn account-btn" title="Mi Cuenta" data-toggle="modal" data-target="#loginModal" aria-label="Ingresar">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span class="btn-text">Ingresar</span>
        </a>

        <a href="user-dashboard.html" class="action-btn icon-action-btn account-icon-link" title="Mi cuenta" aria-label="Mi cuenta">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>

        <a href="dashboard.html" class="action-btn icon-action-btn admin-icon-link" title="Panel de administración" aria-label="Panel de administración">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v6c0 4.5-3.1 8.7-7 10-3.9-1.3-7-5.5-7-10V6l7-3z"></path>
            <path d="M9.5 12.5l1.5 1.5 3.5-4"></path>
          </svg>
        </a>

        <a href="cart.html" class="action-btn cart-btn" title="Carrito de Compras" aria-label="Carrito de Compras">
          <div class="cart-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-badge">0</span>
          </div>
        </a>
      </div>

      <button class="mobile-menu-btn" aria-label="Abrir menú">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </nav>
  </header>
  <section class="cart_section layout_padding">
    <div class="container">
      <div class="custom_heading-container">
        <h2> Tu carrito </h2>
      </div>
      <div id="cart-content">
        <!-- Cart items rendered by js/cart.js -->
      </div>
      <div class="text-center mt-3">
        <a href="tienda-virtual.html" class="btn btn-secondary">Seguir comprando</a>
        <button id="clear-cart" class="btn btn-danger">Vaciar carrito</button>
      </div>
    </div>
  </section>

  <script src="js/jquery-3.4.1.min.js"></script>
  <script src="js/bootstrap.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
