<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>Registro - GW Lavado Ecologico</title>
  <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
  <link href="https://fonts.googleapis.com/css?family=Dosis:400,500|Poppins:400,700&amp;display=swap" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
  <link href="css/responsive.css" rel="stylesheet"/>
</head>
<body>
   <header class="navbar-container">
  <nav class="navbar">
    <!-- 1. Logo / Marca -->
    <a href="index.html" class="brand-logo">
      <img src="./images/logogwlavadoeco.png" alt="GW Lavado Ecologico Logo" class="logo-image">
    </a>

    <!-- 2. Barra de Búsqueda -->
    <div class="search-bar">
      <input type="text" placeholder="Buscar productos, marcas y más..." aria-label="Buscar productos">
      <button type="submit" class="search-btn" aria-label="Buscar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <!-- 3. Menú de Navegación Principal -->
    <ul class="nav-links">
      <li><a href="index.html" class="active">INICIO</a></li>
      <li><a href="store.html">TIENDA VIRTUAL</a></li>
      <li><a href="cursos.html">CURSOS</a></li>
      <li><a href="#">NOSOTROS</a></li>
      <li><a href="contact.html">CONTACTO</a></li>
    </ul>

    <!-- 4. Acciones del Usuario (Cuenta y Carrito) -->
    <div class="user-actions">
      <!-- Mi Cuenta / Login -->
      <a href="#" class="action-btn account-btn" title="Mi Cuenta" data-toggle="modal" data-target="#loginModal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="btn-text">Ingresar</span>
      </a>

      <!-- Carrito de Compras -->
      <a href="#" class="action-btn cart-btn" title="Carrito de Compras">
        <div class="cart-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge">3</span>
        </div>
      </a>
    </div>

    <!-- 5. Botón Hamburguesa para Mobile -->
    <button class="mobile-menu-btn" aria-label="Abrir menú">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </nav>
</header>

  <!-- Register Section -->
  <section id="login-section" class="register-section">
    <div class="login-card">
      <h2>Crear cuenta</h2>
      <p style="margin-top:8px;color:#556;font-size:14px">Crea tu cuenta para comprar en la tienda y acceder a tu panel.</p>
      <form action="/register" method="post" class="login-form register-form">
        <div class="input-group">
          <label for="name">Nombre</label>
          <div class="input-with-icon name-field">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="text" id="name" name="name" placeholder="Tu nombre" required>
          </div>
        </div>
        <div class="input-group">
          <label for="email" style="margin-right: 13px;">Correo</label>
          <div class="input-with-icon email-field">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5v7a2 2 0 002 2h14a2 2 0 002-2v-7" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 8.5l-9 6-9-6" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="email" id="email" name="email" placeholder="usuario@ejemplo.com" required>
          </div>
        </div>
        <div class="input-group" style="display:flex;gap:8px;align-items:center">
          <div style="flex:0 0 180px">
            <label for="phone-code">Código país</label>
            <div class="phone-select" id="phone-select">
              <input type="hidden" id="phone-code" name="phone-code" value="+34">
              <button type="button" class="phone-select-btn" aria-haspopup="listbox" aria-expanded="false">
                <img src="https://flagcdn.com/24x18/es.png" alt="ES" loading="lazy">
                <span class="phone-text">España (+34)</span>
              </button>
              <ul class="phone-select-list" role="listbox" aria-labelledby="phone-select">
                <!-- Will be populated dynamically with all countries -->
              </ul>
            </div>
          </div>
          <div style="flex:1">
            <label for="phone">Teléfono</label>
            <div class="input-with-icon phone-field">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.84 19.84 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.84 19.84 0 013.08 4.18 2 2 0 015 2h3a2 2 0 012 1.72c.12 1.05.38 2.08.76 3.05a2 2 0 01-.45 2.11L9.91 10.91a16 16 0 006 6l1.03-1.03a2 2 0 012.11-.45c.97.38 2 .64 3.05.76A2 2 0 0122 16.92z" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <input type="tel" id="phone" name="phone" placeholder="600 000 000" />
            </div>
            <div id="phone-error" style="color:#b00020;margin-top:6px;display:none;font-size:13px"></div>
          </div>
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>
        <div class="input-group">
          <label for="password2">Repetir contraseña</label>
          <input type="password" id="password2" name="password2" placeholder="Repite la contraseña" required>
        </div>
        <div id="email-verification-area" style="display:none;margin-top:10px">
          <label for="email-code">Código enviado a tu correo</label>
          <input id="email-code" name="verificationCode" class="form-control" style="margin-top:6px" />
          <div id="email-verification-help" style="display:none;margin-top:6px;color:#444;font-size:13px"></div>
        </div>
        <div style="margin-top:12px">
          <button type="submit" class="boton-info">Crear cuenta</button>
        </div>
      </form>

      <script src="js/jquery-3.4.1.min.js"></script>
      <script src="js/bootstrap.js"></script>
      <script src="js/main.js"></script>
      <script src="js/auth.js"></script>
      <script src="https://unpkg.com/libphonenumber-js@1.9.48/bundle/libphonenumber-js.min.js"></script>
      <script src="js/toast.js"></script>
      <script src="js/phone-select.js"></script>
    </div>
  </section>
</body>
</html>
